services:
  # ----------------------------------------------------------------------------
  # MongoDB Database Service
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: startup_cofounder_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: startup_cofounder_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # ChromaDB Vector Store Service (RAG & Memory)
  # ----------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: startup_cofounder_chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - app_network

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service (Agent Orchestration & Core API)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: startup_cofounder_backend
    restart: always
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URL=mongodb://admin:adminpassword@mongodb:27017
      - MONGODB_DB_NAME=startup_cofounder_db
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - app_network

  # ----------------------------------------------------------------------------
  # Streamlit Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: startup_cofounder_frontend
    restart: always
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_BASE_URL=http://backend:8001/api/v1
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  mongo_data:
    driver: local
  chroma_data:
    driver: local

networks:
  app_network:
    driver: bridge
